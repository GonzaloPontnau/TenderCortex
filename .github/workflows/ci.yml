name: TenderCortex CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ── OpenAPI Contract ──────────────────────────────────────────────
  openapi:
    name: OpenAPI Export & Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Export OpenAPI spec
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'fake-key-for-ci' }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY || 'fake-key-for-ci' }}
        run: python scripts/export_openapi.py

      - name: Validate OpenAPI spec
        run: python scripts/validate_openapi.py

      - name: Check for schema drift
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'fake-key-for-ci' }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY || 'fake-key-for-ci' }}
        run: python scripts/check_openapi_drift.py

  # ── Unit Tests ────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests
        env:
          GROQ_API_KEY: fake-key-for-ci
          HUGGINGFACE_API_KEY: fake-key-for-ci
        run: pytest tests/unit -v --tb=short

  # ── BDD Specs ─────────────────────────────────────────────────────
  bdd-specs:
    name: BDD Specs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run BDD specs
        env:
          GROQ_API_KEY: fake-key-for-ci
          HUGGINGFACE_API_KEY: fake-key-for-ci
        run: pytest tests/bdd -v --tb=short

  # ── Integration Tests ─────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run integration tests
        env:
          GROQ_API_KEY: fake-key-for-ci
          HUGGINGFACE_API_KEY: fake-key-for-ci
        run: pytest tests/integration -v --tb=short -m integration

  # ── Coverage ──────────────────────────────────────────────────────
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [unit-tests, bdd-specs]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests with coverage
        env:
          GROQ_API_KEY: fake-key-for-ci
          HUGGINGFACE_API_KEY: fake-key-for-ci
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml -v

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

  # ── Spec Consistency ──────────────────────────────────────────────
  spec-check:
    name: Spec Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check spec consistency
        run: python backend/scripts/check_specs.py

  # ── Frontend Build ────────────────────────────────────────────────
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
